services:
  - type: web
    name: jajal-medical
    env: docker
    plan: free
    branch: main
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: "Medical Case Manager"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
